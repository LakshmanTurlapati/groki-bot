<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Bot Blocked face</title>
<style>
body{margin:0;background:#121212}
@keyframes bodyBlock{0%,21%{transform:translate(0,0) scale(1)}31%,38%{transform:translate(2px,-3px) scale(1)}50%{transform:translate(-11px,-4px) scale(0.84)}57%{transform:translate(2px,-4px) scale(0.84)}64%{transform:translate(-10px,-4px) scale(0.84)}69%{transform:translate(-4px,-4px) scale(0.84)}74%,81%{transform:translate(0,-4px) scale(0.84)}97%,100%{transform:translate(0,0) scale(1)}}
@keyframes eyesBlock{0%,21%{transform:translate(0,0) scaleY(1)}31%,38%{transform:translate(24px,2px) scaleY(1)}43%{transform:translate(4px,4px) scaleY(0.65)}50%{transform:translate(-16px,6px) scaleY(1)}57%{transform:translate(17px,6px) scaleY(1)}64%{transform:translate(-11px,6px) scaleY(1)}76%,81%{transform:translate(17px,6px) scaleY(1)}93%{transform:translate(4px,2px) scaleY(0.75)}97%,100%{transform:translate(0,0) scaleY(1)}}
@keyframes pinchL{0%,38%{transform:translateX(0)}50%,81%{transform:translateX(12.5px)}97%,100%{transform:translateX(0)}}
@keyframes pinchR{0%,38%{transform:translateX(0)}50%,81%{transform:translateX(-12.5px)}97%,100%{transform:translateX(0)}}
@keyframes upL{0%,38%{transform:rotate(0deg)}50%,81%{transform:rotate(-32deg)}97%,100%{transform:rotate(0deg)}}
@keyframes loL{0%,38%{transform:rotate(0deg)}50%,81%{transform:rotate(32deg)}97%,100%{transform:rotate(0deg)}}
@keyframes upR{0%,38%{transform:rotate(0deg)}50%,81%{transform:rotate(32deg)}97%,100%{transform:rotate(0deg)}}
@keyframes loR{0%,38%{transform:rotate(0deg)}50%,81%{transform:rotate(-32deg)}97%,100%{transform:rotate(0deg)}}
.pos{animation:bodyBlock 2.1s ease-in-out infinite;transform-origin:50% 50%}
.eyes{animation:eyesBlock 2.1s ease-in-out infinite;transform-origin:50% 50%}
.pl{animation:pinchL 2.1s ease-in-out infinite}
.pr{animation:pinchR 2.1s ease-in-out infinite}
.upL{animation:upL 2.1s ease-in-out infinite;transform-origin:50% 100%}
.loL{animation:loL 2.1s ease-in-out infinite;transform-origin:50% 0%}
.upR{animation:upR 2.1s ease-in-out infinite;transform-origin:50% 100%}
.loR{animation:loR 2.1s ease-in-out infinite;transform-origin:50% 0%}
</style>
<style>html,body{height:100%}body{display:grid;place-items:center;margin:0}</style>
</head>
<body>
<div style="width: 320px; height: 240px; background: #121212; position: relative; overflow: hidden">
<div class="pos" style="position: absolute; left: 61.5px; top: 52.5px; width: 197px; height: 135px">
<div style="position: absolute; left: 0; top: 0; width: 197px; height: 135px; transform: rotate(-15deg)">
<div style="position: absolute; left: 0; top: 0; width: 197px; height: 135px; border-radius: 67.5px; background: #777777; overflow: hidden">
<div class="eyes" style="position: absolute; left: 86.5px; top: 13.5px; width: 90px; height: 70px">
<div style="position: absolute; left: 9px; top: 11.5px; width: 20px; height: 47px; transform: rotate(-11deg)">
<div class="pl" style="position: absolute; left: 0; top: 0; width: 20px; height: 47px">
<div class="upL" style="position: absolute; left: 0; top: 0; width: 20px; height: 27px; border-radius: 10px; background: #121212"></div>
<div class="loL" style="position: absolute; left: 0; top: 20px; width: 20px; height: 27px; border-radius: 10px; background: #121212"></div>
</div>
</div>
<div style="position: absolute; left: 61.5px; top: 11.5px; width: 20px; height: 47px; transform: rotate(-11deg)">
<div class="pr" style="position: absolute; left: 0; top: 0; width: 20px; height: 47px">
<div class="upR" style="position: absolute; left: 0; top: 0; width: 20px; height: 27px; border-radius: 10px; background: #121212"></div>
<div class="loR" style="position: absolute; left: 0; top: 20px; width: 20px; height: 27px; border-radius: 10px; background: #121212"></div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
