<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Bot Sleeping face</title>
<style>
body{margin:0;background:#121212}
@keyframes swell{0%{transform:scale(1.02)}11%,21%{transform:scale(1)}46%,54%{transform:scale(1.067)}79%,89%{transform:scale(1)}100%{transform:scale(1.02)}}
@keyframes drift{0%,21%{transform:translate(0,0)}46%,54%{transform:translate(-12px,0)}79%,100%{transform:translate(0,0)}}
.pos{animation:swell 5.6s ease-in-out infinite;transform-origin:50% 50%}
.eyes{animation:drift 5.6s ease-in-out infinite}
</style>
<style>html,body{height:100%}body{display:grid;place-items:center;margin:0}</style>
</head>
<body>
<div style="width: 320px; height: 240px; background: #121212; position: relative; overflow: hidden">
<div class="pos" style="position: absolute; left: 61.5px; top: 52.5px; width: 197px; height: 135px">
<div style="position: absolute; left: 0; top: 0; width: 197px; height: 135px; transform: rotate(-15deg)">
<div style="position: absolute; left: 0; top: 0; width: 197px; height: 135px; border-radius: 67.5px; background: #777777; overflow: hidden">
<div class="eyes" style="position: absolute; left: 86.5px; top: 13.5px; width: 90px; height: 70px">
<div style="position: absolute; left: 0.5px; top: 23px; width: 37px; height: 24px; border-radius: 12px; background: #121212"></div>
<div style="position: absolute; left: 52.5px; top: 23px; width: 37px; height: 24px; border-radius: 12px; background: #121212"></div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
