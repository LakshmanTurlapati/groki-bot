<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Bot Done face</title>
<style>
body{margin:0;background:#121212}
@keyframes hop{0%{transform:translate(0,-7px) scale(0.944,1.074)}4%{transform:translate(0,3px) scale(1.04,0.97)}12%,35%{transform:translate(0,0) scale(1,1)}46%{transform:translate(0,4px) scale(1.067,0.965)}50%{transform:translate(0,-27px) scale(1,1.1)}54%{transform:translate(0,-31px) scale(1,1.05)}58%{transform:translate(0,-13px) scale(1,1)}62%{transform:translate(0,-3px) scale(1.04,0.98)}65%{transform:translate(0,-23px) scale(1.056,0.99)}69%{transform:translate(0,-31px) scale(1,1.05)}73%{transform:translate(0,-21px) scale(1,1.02)}77%{transform:translate(0,-23px) scale(1,1.03)}81%{transform:translate(0,-26px) scale(1,1.04)}85%{transform:translate(0,-5px) scale(1,1.04)}88%{transform:translate(0,-11px) scale(1,1)}92%{transform:translate(0,-6px) scale(1,1)}96%{transform:translate(0,0) scale(1.04,0.97)}100%{transform:translate(0,-7px) scale(0.944,1.074)}}
@keyframes look{0%,46%{transform:translate(0,0) rotate(0deg)}50%,58%{transform:translate(-6px,-16px) rotate(-12deg)}63%{transform:translate(0,-14px) rotate(0deg)}69%,81%{transform:translate(16px,-16px) rotate(18deg)}88%{transform:translate(6px,-6px) rotate(6deg)}96%,100%{transform:translate(0,0) rotate(0deg)}}
.pos{animation:hop 3.9s ease-in-out infinite;transform-origin:50% 100%}
.eyes{animation:look 3.9s ease-in-out infinite;transform-origin:50% 50%}
</style>
<style>html,body{height:100%}body{display:grid;place-items:center;margin:0}</style>
</head>
<body>
<div style="width: 320px; height: 240px; background: #121212; position: relative; overflow: hidden">
<div class="pos" style="position: absolute; left: 61.5px; top: 52.5px; width: 197px; height: 135px">
<div style="position: absolute; left: 0; top: 0; width: 197px; height: 135px; transform: rotate(-15deg)">
<div style="position: absolute; left: 0; top: 0; width: 197px; height: 135px; border-radius: 67.5px; background: #777777; overflow: hidden">
<div class="eyes" style="position: absolute; left: 86.5px; top: 13.5px; width: 90px; height: 70px">
<div style="position: absolute; left: 0; top: 12px; width: 45px; height: 34px; box-sizing: border-box; border: 17px solid #121212; border-bottom: 0; border-radius: 22.5px 22.5px 0 0"></div>
<div style="position: absolute; left: 52px; top: 12px; width: 45px; height: 34px; box-sizing: border-box; border: 17px solid #121212; border-bottom: 0; border-radius: 22.5px 22.5px 0 0"></div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
